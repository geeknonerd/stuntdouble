version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "04:00"
    open-pull-requests-limit: 5
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - patch
  - package-ecosystem: cargo
    directory: /research/spikes/175-shared-state-ipc
    schedule:
      interval: weekly
      day: sunday
      time: "04:00"
    open-pull-requests-limit: 5
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - patch
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "04:00"
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "04:00"
    open-pull-requests-limit: 5
    # release.yml is generated by cargo-dist: its pins are owned by
    # [dist.github-action-commits] in dist-workspace.toml and only move with
    # `dist generate`. Scanning the generated file would open pull requests
    # against generated lines, and the `ignore` workaround it replaces also
    # froze these actions' security updates.
    exclude-paths:
      - ".github/workflows/release.yml"
    groups:
      # Pins owned by dist-workspace.toml. This group has to stay first:
      # Dependabot only assigns a dependency to the first group it matches.
      dist-managed:
        patterns:
          - "actions/checkout"
          - "actions/upload-artifact"
          - "actions/download-artifact"
          - "actions/attest"
      actions:
        patterns:
          - "*"
