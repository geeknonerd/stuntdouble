name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cargo
        run: echo "exists=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.cargo.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - if: steps.cargo.outputs.exists == 'true'
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cargo
        run: echo "exists=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.cargo.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - if: steps.cargo.outputs.exists == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cargo
        run: echo "exists=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.cargo.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - if: steps.cargo.outputs.exists == 'true'
        run: cargo test --workspace --all-features

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cargo
        run: echo "exists=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.cargo.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - if: steps.cargo.outputs.exists == 'true'
        run: cargo doc --no-deps
      - if: steps.cargo.outputs.exists == 'true'
        run: cargo test --doc

  docs-links:
    name: docs-links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --exclude-path target --exclude-path .git './**/*.md'
          fail: true
      - name: Check bilingual document pairs
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r zh; do
            en="${zh%.zh-CN.md}.md"
            if [[ ! -f "$en" ]]; then
              echo "::error file=${zh#./}::missing English twin ${en#./}"
              failed=1
              continue
            fi
            if ! head -n 8 "$en" | grep -qF "$(basename "$zh")"; then
              echo "::error file=${en#./}::missing language switch link to $(basename "$zh")"
              failed=1
            fi
            if ! head -n 8 "$zh" | grep -qF "$(basename "$en")"; then
              echo "::error file=${zh#./}::missing language switch link to $(basename "$en")"
              failed=1
            fi
          done < <(find . -name '*.zh-CN.md' -not -path './.git/*' -not -path './target/*' | sort)
          exit "$failed"

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cargo
        run: echo "exists=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.cargo.outputs.exists == 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cargo
        run: echo "exists=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.cargo.outputs.exists == 'true'
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cargo
        run: echo "exists=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.cargo.outputs.exists == 'true'
        run: |
          msrv=$(awk -F'"' '/^rust-version/ { print $2; exit }' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "Cargo.toml is missing rust-version" >&2
            exit 1
          fi
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
        id: msrv_version
      - if: steps.cargo.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # master
        with:
          toolchain: ${{ steps.msrv_version.outputs.msrv }}
      - if: steps.cargo.outputs.exists == 'true'
        run: cargo check --workspace --all-features
