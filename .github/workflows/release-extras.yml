# Attaches and verifies every non-dist release asset while the GitHub Release is
# still a draft. Configured as a cargo-dist publish job in dist-workspace.toml:
# it must succeed before the generated announce job uploads the dist artifacts
# and undrafts the release (#41).
name: Release extras

on:
  workflow_call:
    inputs:
      plan:
        description: cargo-dist manifest for the release
        required: true
        type: string

permissions: {}

jobs:
  release-extras:
    name: "Draft release assets: SBOM, container image, attestation verification"
    runs-on: ubuntu-22.04
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve the release tag
        id: release
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          tag="$(jq -r '.announcement_tag' <<<"$PLAN")"
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "The dist plan does not contain an announcement_tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Create the draft Release
        env:
          PLAN: ${{ inputs.plan }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          plan_file="$(mktemp)"
          printf '%s' "$PLAN" > "$plan_file"
          ./.github/scripts/ensure-draft-release.sh "$TAG" "$plan_file"

      - name: Generate a CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          version=0.5.9
          archive="cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz"
          expected_sha256=fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8
          tmpdir="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${version}/${archive}" \
            -o "$tmpdir/$archive"
          printf '%s  %s\n' "$expected_sha256" "$archive" | (cd "$tmpdir" && sha256sum --check -)
          mkdir -p "$HOME/.cargo/bin"
          tar -xJf "$tmpdir/$archive" -C "$HOME/.cargo/bin" --strip-components=1 \
            "cargo-cyclonedx-x86_64-unknown-linux-gnu/cargo-cyclonedx"
          export PATH="$HOME/.cargo/bin:$PATH"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" cargo cyclonedx -f json -v
          tag="${{ steps.release.outputs.tag }}"
          mv stuntdouble.cdx.json "stuntdouble-${tag#v}.cdx.json"

      - name: Attach the conventional checksum file
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          test -f artifacts/sha256.sum
          cp artifacts/sha256.sum SHA256SUMS
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'SHA256SUMS'; then
            echo "SHA256SUMS is already attached to $TAG; leaving it unchanged."
          else
            gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY"
          fi

      - name: Attach the SBOM to the GitHub Release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          asset="stuntdouble-${TAG#v}.cdx.json"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
            echo "$asset is already attached to $TAG; leaving it unchanged."
          else
            gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the container tag
        id: image
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}:${TAG}"
          inspect_log="$(mktemp)"
          digest=""
          for attempt in 1 2 3; do
            if output="$(docker buildx imagetools inspect "$image" 2>"$inspect_log")"; then
              digest="$(printf '%s\n' "$output" | awk '/^Digest:/ { print $2; exit }')"
              if [[ -z "$digest" ]]; then
                echo "inspect returned no digest for $image" >&2
                exit 1
              fi
              break
            fi
            if grep -Eqi 'not found|manifest unknown' "$inspect_log"; then
              break
            fi
            echo "inspect attempt $attempt failed; retrying" >&2
            sleep 5
          done
          if [[ -n "$digest" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "$image already exists at $digest; skipping the push."
          elif grep -Eqi 'not found|manifest unknown' "$inspect_log"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$image does not exist yet."
          else
            echo "could not determine whether $image exists; refusing to publish" >&2
            cat "$inspect_log" >&2
            exit 1
          fi

      - name: Build and push the container image
        id: container
        if: ${{ steps.image.outputs.exists != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      - name: Resolve the container digest
        id: container-digest
        env:
          EXISTING_DIGEST: ${{ steps.image.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.container.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${PUSHED_DIGEST:-$EXISTING_DIGEST}"
          if [[ -z "$digest" ]]; then
            echo "container digest is empty" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the container image
        if: ${{ steps.image.outputs.exists != 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.container-digest.outputs.digest }}
          push-to-registry: true

      - name: Verify the container image is pullable
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}:${TAG}"
          for attempt in 1 2 3 4 5; do
            if docker pull "$image" >/dev/null; then
              exit 0
            fi
            echo "pull attempt $attempt failed; retrying" >&2
            sleep 5
          done
          echo "failed to pull $image" >&2
          exit 1

      - name: Verify the container image covers both platforms
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}:${TAG}"
          platforms="$(docker buildx imagetools inspect "$image" --raw \
            | jq -r '[.manifests[]? | select(.platform.os == "linux") | .platform.architecture] | sort | unique | join(" ")')"
          if [[ "$platforms" != "amd64 arm64" ]]; then
            echo "expected a linux/amd64 and linux/arm64 image index, got: ${platforms:-<no platforms>}" >&2
            exit 1
          fi

      - name: Verify the container attestation
        env:
          DIGEST: ${{ steps.container-digest.outputs.digest }}
        run: |
          set -euo pipefail
          image="oci://ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
          for attempt in 1 2 3 4 5; do
            if gh attestation verify "$image" --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "container attestation attempt $attempt failed; retrying" >&2
            sleep 5
          done
          echo "failed to verify the container attestation for $image" >&2
          exit 1

      - name: Attach the container reference to the GitHub Release
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          DIGEST: ${{ steps.container-digest.outputs.digest }}
        run: |
          set -euo pipefail
          asset="stuntdouble-${TAG#v}-image.txt"
          reference="ghcr.io/${GITHUB_REPOSITORY}:${TAG}@${DIGEST}"
          existing="$(mktemp -d)"
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$existing" 2>/dev/null; then
            if diff -q <(printf '%s\n' "$reference") "$existing/$asset" >/dev/null; then
              echo "$asset already matches $DIGEST; leaving it unchanged."
              exit 0
            fi
            echo "$asset already exists with a different digest; refusing to overwrite" >&2
            exit 1
          fi
          printf '%s\n' "$reference" > "$asset"
          gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"

      - name: Verify the binary attestation
        run: |
          set -euo pipefail
          archive=artifacts/stuntdouble-x86_64-unknown-linux-gnu.tar.gz
          if [[ ! -f "$archive" ]]; then
            echo "the Linux archive is missing from the downloaded dist artifacts" >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "binary attestation attempt $attempt failed; retrying" >&2
            sleep 5
          done
          echo "failed to verify the binary attestation for $archive" >&2
          exit 1

      - name: Verify the release is complete before publication
        shell: bash
        env:
          PLAN: ${{ inputs.plan }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          plan_file="$(mktemp)"
          actual_file="$(mktemp)"
          printf '%s' "$PLAN" > "$plan_file"
          # Assets this job already attached to the draft Release.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' > "$actual_file"
          # Dist artifacts the announce job will upload; its Cleanup step removes
          # the granular per-job manifests first, so exclude them here as well.
          find artifacts -maxdepth 1 -type f ! -name '*-dist-manifest.json' -printf '%f\n' \
            >> "$actual_file"
          ./.github/scripts/check-release-assets.sh "$plan_file" "$actual_file" "$version"

