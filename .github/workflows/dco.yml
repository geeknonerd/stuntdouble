name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    # release-plz cannot add a `Signed-off-by` trailer to the commits it
    # generates, so release pull requests from this repository's
    # `release-plz-*` branches skip the check; a skipped job reports success.
    # Requiring the branch to live in this repository keeps fork pull requests,
    # whose branch names we do not control, covered.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-plz-')) }}
    steps:
      - name: Get PR Commits
        if: github.event_name == 'pull_request'
        id: 'get-pr-commits'
        uses: tim-actions/get-pr-commits@198af03565609bb4ed924d1260247b4881f09e7d # v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'pull_request'
        uses: tim-actions/dco@f2279e6e62d5a7d9115b0cb8e837b777b1b02e21 # v1.1.0
        with:
          commits: ${{ steps.get-pr-commits.outputs.commits }}
