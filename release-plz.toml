[workspace]
# This repository currently publishes release binaries and container images,
# not the crate itself. Set publish = true and provide CARGO_REGISTRY_TOKEN in
# the release-plz workflow to enable crates.io publishing.
publish = false
# release-plz creates the tag; cargo-dist owns the GitHub Release and its assets.
git_release_enable = false
git_tag_enable = true
# Published state is derived from git tags because the crate is not on crates.io.
# Its tag detection regex is `^vX.Y.Z$` (numeric version group, hard-coded
# upstream), so prerelease tags are invisible and must never be used as
# release markers; keep Cargo.toml versions plain `MAJOR.MINOR.PATCH`.
git_only = true
# Only commits that change what we ship (or its dependencies) trigger a
# version PR: the listed commit types, any `deps` scope, and any breaking
# change. docs/ci/test/chore merges land in the changelog of the next real
# release instead of cutting a patch release of their own.
release_commits = '^(feat|fix|perf|refactor|security|build)(\(.+\))?!?:|^[a-z]+\(deps[^)]*\)!?:|^[a-z]+(\(.+\))?!:'
