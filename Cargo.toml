[package]
name = "stuntdouble"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Rust mock server for integration testing against real external dependencies"
repository = "https://github.com/geeknonerd/stuntdouble"

[[bin]]
name = "stuntdouble"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["multipart"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
boa_engine = { version = "0.22", default-features = false }
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
base64 = "0.23"
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
panic = "allow"
module_name_repetitions = "allow"
unused_self = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
