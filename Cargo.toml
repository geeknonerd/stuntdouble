[package]
name = "stuntdouble"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "Rust mock server for integration testing against real external dependencies"

[[bin]]
name = "stuntdouble"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
axum = "0.8"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
panic = "allow"
module_name_repetitions = "allow"
unused_self = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
